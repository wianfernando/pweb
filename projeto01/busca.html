<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <title>JM Viagens - Buscar Pacotes</title>
</head>
<body>
    <table border="0" width="900" align="center">
        <tr>
            <td><img src="imagens/logo.png" /></td>
            <td align="right">
                <a href="index.html">Home</a> | 
                <a href="quem-somos.html">Quem somos</a> | 
                <a href="destinos.html">Destinos</a> | 
                <a href="busca.html">Buscar Pacotes</a> | 
                <a href="contato.html">Contato</a>
            </td>
        </tr>

        <tr>
            <td colspan="2">
                <img src="imagens/principal.png" />
            </td>
        </tr>

        <tr>
            <td colspan="2">
                <h2>Buscar Pacotes de Viagens</h2>
                <br />
                <form action="#" method="GET">
                    <table border="0" width="100%">
                        <tr>
                            <td width="180">Origem:</td>
                            <td><input type="text" name="origem" size="30" required /></td>
                        </tr>
                        <tr>
                            <td>Destino:</td>
                            <td><input type="text" name="destino" size="30" required /></td>
                        </tr>
                        <tr>
                            <td>Data Partida:</td>
                            <td><input type="date" name="data_partida" required /></td>
                        </tr>
                        <tr>
                            <td>Data Retorno:</td>
                            <td><input type="date" name="data_retorno" required /></td>
                        </tr>
                        <tr>
                            <td>Quartos:</td>
                            <td>
                                <select name="quartos">
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td>Qtde Adultos:</td>
                            <td><input type="number" name="qtd_adultos" min="1" value="1" /></td>
                        </tr>
                        <tr>
                            <td>Qtde Crianças:</td>
                            <td><input type="number" name="qtd_criancas" min="0" value="0" /></td>
                        </tr>
                        <tr>
                            <td></td>
                            <td>
                                <br />
                                <input type="submit" value="Buscar" />
                            </td>
                        </tr>
                    </table>
                </form>
            </td>
        </tr>

        <tr>
            <td colspan="2" align="center">
                <h4>Todos os direitos reservados</h4>
            </td>
        </tr>
    </table>
</body>
</html>
